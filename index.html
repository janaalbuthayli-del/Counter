<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صانع العداد الدائري</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0e141b;--card:#161f29;--line:#263241;--fg:#eef2f6;--mut:#8b9bab;--acc:#2f80ed}
@media (prefers-color-scheme: light){:root{--bg:#f3f5f8;--card:#fff;--line:#e2e7ee;--fg:#16212c;--mut:#6a7987}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Tajawal,system-ui,sans-serif;font-size:15px}
header{padding:18px 20px 6px;max-width:1100px;margin:auto}
h1{margin:0;font-size:22px;font-weight:800}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1100px;margin:auto;padding:12px 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:18px;padding:16px}
.preview{position:sticky;top:12px}
@media (max-width:820px){.preview{position:static}}
.stage{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;
 background-color:#cfd6de;background-image:linear-gradient(45deg,#b7c0ca 25%,transparent 25%),linear-gradient(-45deg,#b7c0ca 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#b7c0ca 75%),linear-gradient(-45deg,transparent 75%,#b7c0ca 75%);
 background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}
.stage.dark{background-color:#1d252e;background-image:linear-gradient(45deg,#2a333e 25%,transparent 25%),linear-gradient(-45deg,#2a333e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a333e 75%),linear-gradient(-45deg,transparent 75%,#2a333e 75%)}
.stage canvas{width:100%;height:100%;display:block}
.prow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;background:var(--line);color:var(--fg);font:inherit;font-weight:700;font-size:15px;padding:11px 16px;border-radius:12px;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.grow{flex:1}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:700}
.sec+.sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{color:var(--mut);font-size:13px}
input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;padding:10px;border-radius:10px}
input.big{font-size:22px;font-weight:800;direction:ltr;text-align:right}
.color{display:flex;align-items:center;gap:8px}
.color input[type=color]{width:44px;height:40px;border:0;padding:0;background:none;border-radius:10px;cursor:pointer}
.color input[type=text]{direction:ltr;text-align:left;font-family:monospace}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
input[type=range]{width:100%;accent-color:var(--acc)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.exp{display:flex;flex-direction:column;gap:8px}
.exp .btn{text-align:right;display:flex;flex-direction:column;gap:2px}
.exp .btn small{font-weight:400;color:inherit;opacity:.8;font-size:13px}
.status{margin-top:10px;font-size:14px;color:var(--mut);min-height:20px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .1s}
.note{font-size:13px;color:var(--mut);line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>صانع العداد الدائري</h1>
  <p>اكتب الرقم واختر الألوان، وبعدها نزّل الفيديو بدون خلفية وركّبه على فيديوك.</p>
</header>
<main>
  <div class="card preview">
    <div class="stage" id="stage"><canvas id="cv" width="1080" height="1080"></canvas></div>
    <div class="prow">
      <button class="btn pri grow" id="play">▶ تشغيل المعاينة</button>
      <button class="btn" id="bgt" title="تغيير خلفية المعاينة">◐ الخلفية</button>
    </div>

    <div class="sec" style="margin-top:16px">
      <h2>تنزيل الفيديو</h2>
      <div class="exp">
        <button class="btn pri" id="exAlpha">فيديو شفاف (WebM)<small>بدون خلفية · يشتغل من Chrome أو Edge (كمبيوتر أو أندرويد)</small></button>
        <button class="btn" id="exGreen">فيديو بخلفية خضراء (MP4)<small>للمونتاج من الجوال: شيل الخلفية بأداة Chroma Key</small></button>
        <button class="btn" id="exPng">صور PNG شفافة (ZIP)<small>تسلسل صور لبرامج Premiere وAfter Effects وFinal Cut وDaVinci</small></button>
      </div>
      <div class="status" id="st"></div>
      <div class="bar" id="bar"><i id="barI"></i></div>
      <div class="note">خلّ الصفحة مفتوحة وقدّامك وقت تسجيل الفيديو. التسجيل ياخذ نفس مدة العداد.</div>
    </div>
  </div>

  <div class="card">
    <div class="sec">
      <h2>الرقم</h2>
      <div class="grid">
        <div class="f full"><label>الرقم النهائي</label><input class="big" id="value" type="text" inputmode="decimal" value="2450000"></div>
        <div class="f"><label>الوحدة (تحت الرقم)</label><input id="unit" type="text" value="ريال" placeholder="ريال، كم، متر…"></div>
        <div class="f"><label>عنوان (فوق الرقم، اختياري)</label><input id="title" type="text" value="" placeholder="التكلفة الإجمالية"></div>
        <div class="f"><label>الخانات العشرية</label><select id="dec"><option value="0">بدون</option><option value="1">1</option><option value="2">2</option></select></div>
        <div class="f"><label>شكل الأرقام</label><select id="digits"><option value="en">1,234</option><option value="ar">١٬٢٣٤</option></select></div>
        <div class="f full"><label>فاصلة الآلاف</label><div class="seg" data-k="sep"><button data-v="1">نعم</button><button data-v="0">لا</button></div></div>
      </div>
    </div>

    <div class="sec">
      <h2>الألوان</h2>
      <div class="grid">
        <div class="f full"><label>لون الدائرة</label>
          <div class="color"><input type="color" id="ring" value="#2f80ed"><input type="text" id="ringH" value="#2f80ed"></div>
          <div class="sw" data-for="ring"></div></div>
        <div class="f full"><label>لون الرقم والنص</label>
          <div class="color"><input type="color" id="text" value="#ffffff"><input type="text" id="textH" value="#ffffff"></div>
          <div class="sw" data-for="text"></div></div>
        <div class="f"><label>لون الحلقة الخلفية</label>
          <div class="color"><input type="color" id="track" value="#ffffff"><input type="text" id="trackH" value="#ffffff"></div></div>
        <div class="f"><label>شفافية الحلقة الخلفية <b id="taV"></b></label><input type="range" id="trackA" min="0" max="100" value="22"></div>
      </div>
    </div>

    <div class="sec">
      <h2>الشكل والحركة</h2>
      <div class="grid">
        <div class="f"><label>سماكة الدائرة <b id="thV"></b></label><input type="range" id="thick" min="2" max="18" value="9"></div>
        <div class="f"><label>حجم الرقم <b id="nsV"></b></label><input type="range" id="nsize" min="60" max="130" value="100"></div>
        <div class="f"><label>مدة العد (ثانية)</label><input type="number" id="dur" min="0.5" max="20" step="0.5" value="3"></div>
        <div class="f"><label>ثبات في النهاية (ثانية)</label><input type="number" id="hold" min="0" max="20" step="0.5" value="1.5"></div>
        <div class="f full"><label>نوع الحركة</label><div class="seg" data-k="ease"><button data-v="out">سريع ثم يهدأ</button><button data-v="inout">ناعم</button><button data-v="lin">ثابت</button></div></div>
        <div class="f full"><label>الدائرة</label><div class="seg" data-k="ringMode"><button data-v="fill">تمتلي مع العد</button><button data-v="full">كاملة من البداية</button><button data-v="none">بدون دائرة</button></div></div>
        <div class="f full"><label>سرعة الإطارات</label><div class="seg" data-k="fps"><button data-v="30">30</button><button data-v="60">60</button></div></div>
      </div>
    </div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const S=1080, cv=$('cv'), ctx=cv.getContext('2d');
const SWATCH=['#2f80ed','#27ae60','#f2994a','#eb5757','#9b51e0','#f2c94c','#00b8d9','#ffffff','#111111','#c9a227'];
const DEF={value:'2450000',unit:'ريال',title:'',dec:'0',digits:'en',sep:'1',ring:'#2f80ed',text:'#ffffff',track:'#ffffff',trackA:22,thick:9,nsize:100,dur:3,hold:1.5,ease:'out',ringMode:'fill',fps:'30'};
const store={get(){try{return JSON.parse(localStorage.getItem('cm_opts')||'null')}catch(e){return null}},set(v){try{localStorage.setItem('cm_opts',JSON.stringify(v))}catch(e){}}};
let o=Object.assign({},DEF,store.get()||{});

/* ---------- UI binding ---------- */
const textIds=['value','unit','title','dec','digits','dur','hold'];
const rangeIds=['trackA','thick','nsize'];
function syncUI(){
  textIds.forEach(k=>$(k).value=o[k]);
  rangeIds.forEach(k=>$(k).value=o[k]);
  ['ring','text','track'].forEach(k=>{$(k).value=o[k];$(k+'H').value=o[k]});
  document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(o[s.dataset.k])===b.dataset.v)));
  $('taV').textContent=o.trackA+'%';$('thV').textContent=o.thick;$('nsV').textContent=o.nsize+'%';
}
function changed(){store.set(o);syncUI();if(!playing)render(1)}
textIds.forEach(k=>$(k).addEventListener('input',e=>{o[k]=e.target.value;changed()}));
rangeIds.forEach(k=>$(k).addEventListener('input',e=>{o[k]=+e.target.value;changed()}));
['ring','text','track'].forEach(k=>{
  $(k).addEventListener('input',e=>{o[k]=e.target.value;changed()});
  $(k+'H').addEventListener('change',e=>{let v=e.target.value.trim();if(!v.startsWith('#'))v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v)){o[k]=v.toLowerCase()}changed()});
});
document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;o[s.dataset.k]=b.dataset.v;changed()}));
document.querySelectorAll('.sw').forEach(w=>{SWATCH.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>{o[w.dataset.for]=c;changed()};w.appendChild(b)})});
$('bgt').onclick=()=>$('stage').classList.toggle('dark');

/* ---------- drawing ---------- */
const EASE={out:t=>1-Math.pow(1-t,3),inout:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lin:t=>t};
const AR='٠١٢٣٤٥٦٧٨٩';
function target(){const v=parseFloat(String(o.value).replace(/[,\s٬]/g,'').replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace('٫','.'));return isFinite(v)?v:0}
function fmt(v){
  const dec=+o.dec;
  let s=v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec,useGrouping:o.sep==='1'});
  if(o.digits==='ar')s=s.replace(/\d/g,d=>AR[d]).replace(/,/g,'٬').replace(/\./g,'٫');
  return s;
}
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
// draw digits in fixed-width cells so the number doesn't wobble while counting
function drawNumber(str,cx,cy,size){
  ctx.font=`800 ${size}px Tajawal, sans-serif`;
  const digs=o.digits==='ar'?AR:'0123456789';
  let cell=0;for(const d of digs)cell=Math.max(cell,ctx.measureText(d).width);
  const w=ch=>digs.includes(ch)?cell:ctx.measureText(ch).width;
  let total=0;for(const ch of str)total+=w(ch);
  let x=cx-total/2;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const ch of str){const cw=w(ch);ctx.fillText(ch,x+cw/2,cy);x+=cw}
  return total;
}
function fitSize(str,maxW,start){
  let size=start;const digs=o.digits==='ar'?AR:'0123456789';
  while(size>30){ctx.font=`800 ${size}px Tajawal, sans-serif`;let cell=0;for(const d of digs)cell=Math.max(cell,ctx.measureText(d).width);
    let t=0;for(const ch of str)t+=digs.includes(ch)?cell:ctx.measureText(ch).width;if(t<=maxW)return size;size-=4}
  return size;
}
function render(t,bg){
  const p=EASE[o.ease](Math.max(0,Math.min(1,t)));
  ctx.clearRect(0,0,S,S);
  if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,S,S)}
  const cx=S/2,cy=S/2,lw=S*o.thick/200,R=S*0.42-lw/2;
  if(o.ringMode!=='none'){
    ctx.lineWidth=lw;ctx.lineCap='round';
    if(o.trackA>0&&o.ringMode==='fill'){ctx.strokeStyle=rgba(o.track,o.trackA/100);ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke()}
    const pr=o.ringMode==='full'?1:p;
    if(pr>0.0005){ctx.strokeStyle=o.ring;ctx.beginPath();ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(pr,1));ctx.stroke()}
  }
  const tv=target(),inner=(R-lw/2)*2*0.86;
  const size=fitSize(fmt(tv),inner,Math.round(S*0.17*o.nsize/100));
  const hasU=!!o.unit.trim(),hasT=!!o.title.trim();
  const sub=Math.round(S*0.058);
  let ny=cy+(hasU?-sub*0.55:0)+(hasT?sub*0.45:0);
  ctx.fillStyle=o.text;
  drawNumber(fmt(tv*p),cx,ny,size);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
  if(hasT){ctx.font=`700 ${sub}px Tajawal, sans-serif`;let fs=sub;while(ctx.measureText(o.title).width>inner&&fs>20){fs-=2;ctx.font=`700 ${fs}px Tajawal, sans-serif`}ctx.fillText(o.title,cx,ny-size*0.66-fs*0.6)}
  if(hasU){ctx.font=`500 ${sub}px Tajawal, sans-serif`;ctx.fillText(o.unit,cx,ny+size*0.58+sub*0.35)}
  ctx.direction='ltr';
}

/* ---------- preview ---------- */
let playing=false;
function play(){
  if(playing)return;playing=true;$('play').disabled=true;
  const dur=+o.dur*1000,hold=+o.hold*1000,t0=performance.now();
  (function f(){const e=performance.now()-t0;render(e/dur);if(e<dur+hold)requestAnimationFrame(f);else{playing=false;$('play').disabled=false}})();
}
$('play').onclick=play;

/* ---------- export ---------- */
let dl=null;
(async()=>{try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){dl=null}})();
function status(msg,prog){$('st').textContent=msg;$('bar').style.display=prog==null?'none':'block';if(prog!=null)$('barI').style.width=(prog*100)+'%'}
function busy(b){['exAlpha','exGreen','exPng','play'].forEach(id=>$(id).disabled=b)}
function fname(ext){const base=(o.title.trim()||o.unit.trim()||'عداد').replace(/[\\/:*?"<>|]/g,'')+'_'+String(o.value).replace(/[^\d.]/g,'');return base+'.'+ext}
async function save(blob,ext){
  if(!dl){try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}}
  if(!dl){ // outside claude.ai: plain browser download
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname(ext);document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);status('تم ✓');return}
  try{await dl.save({filename:fname(ext),data:blob});status('تم ✓')}
  catch(e){const c=e&&e.code;status(c==='declined'?'تم إلغاء التنزيل.':c==='too_large'?'الملف كبير، جرّب مدة أقصر.':'ما قدرت أنزّل الملف ('+(c||'خطأ')+').')}
}
async function recordVideo(bg){
  const types=bg?['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm']:['video/webm;codecs=vp9','video/webm;codecs=vp8'];
  const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mime){status(bg?'متصفحك ما يدعم تسجيل الفيديو. جرّب Chrome.':'الفيديو الشفاف يحتاج Chrome أو Edge. جرّب الفيديو الأخضر أو صور PNG.');return}
  busy(true);
  const fps=+o.fps,dur=+o.dur*1000,hold=+o.hold*1000;
  render(0,bg);
  const stream=cv.captureStream(fps);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16e6});
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);
  rec.start();
  await new Promise(r=>setTimeout(r,150));
  const t0=performance.now();
  await new Promise(res=>{(function f(){const e=performance.now()-t0;render(e/dur,bg);status('جاري التسجيل…',Math.min(1,e/(dur+hold)));if(e<dur+hold+150)requestAnimationFrame(f);else res()})()});
  rec.stop();await done;stream.getTracks().forEach(t=>t.stop());
  render(1);busy(false);
  const ext=mime.startsWith('video/mp4')?'mp4':'webm';
  status('جاهز، جاري التنزيل…');
  await save(new Blob(chunks,{type:mime.split(';')[0]}),ext);
}
async function exportPng(){
  if(!window.JSZip){status('ما قدرت أحمّل أداة الضغط. حدّث الصفحة.');return}
  busy(true);
  const fps=+o.fps,nA=Math.round(+o.dur*fps),nT=nA+Math.round(+o.hold*fps),zip=new JSZip();
  for(let i=0;i<nT;i++){
    render(nA>1?i/(nA-1):1);
    const b=await new Promise(r=>cv.toBlob(r,'image/png'));
    zip.file('frame_'+String(i).padStart(4,'0')+'.png',b);
    if(i%5==0){status('جاري تجهيز الصور… '+(i+1)+' من '+nT,(i+1)/nT);await new Promise(r=>setTimeout(r))}
  }
  zip.file('اقرأني.txt','تسلسل صور PNG شفافة بسرعة '+fps+' إطار بالثانية.\nفي Premiere: Import ثم اختر أول صورة وفعّل Image Sequence.\nفي After Effects: Import ثم PNG Sequence.\nفي Final Cut وDaVinci: استورد المجلد كتسلسل صور.\n');
  status('جاري ضغط الملف…',1);
  const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
  render(1);busy(false);
  await save(blob,'zip');
}
$('exAlpha').onclick=()=>recordVideo(null);
$('exGreen').onclick=()=>{const g=parseInt(o.ring.slice(1),16),r=g>>16&255,gg=g>>8&255,b=g&255;recordVideo(gg>r&&gg>b&&gg>120?'#ff00ff':'#00ff00')};
$('exPng').onclick=exportPng;
if(!(window.MediaRecorder&&MediaRecorder.isTypeSupported&&(MediaRecorder.isTypeSupported('video/webm;codecs=vp9')||MediaRecorder.isTypeSupported('video/webm;codecs=vp8'))))
  $('exAlpha').querySelector('small').textContent='متصفحك الحالي ما يدعم الفيديو الشفاف. افتح الصفحة من Chrome أو Edge';

syncUI();
(document.fonts?document.fonts.load('800 100px Tajawal').then(()=>document.fonts.load('500 60px Tajawal')):Promise.resolve()).catch(()=>{}).then(()=>{render(1);setTimeout(play,300)});
render(1);
</script>
</body>
</html>
